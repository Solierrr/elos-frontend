<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro fornecedor</title>

    <link rel="stylesheet" type="text/css" href="style/style.css">
    <link rel="stylesheet" type="text/css" href="style/text.css">
    <link rel="stylesheet" type="text/css" href="style/variables.css">
    <link rel="stylesheet" type="text/css" href="style/cadastroFornecedor.css">
    <link rel="icon" type="image/svg" href="assets/icone/LOGO.svg" >

</head>
<body>
    <div class ="containerP">
        <header>
            <a  href="">
                <img src="assets/icone/Logo_com_nome.svg" alt="logo-elos" width="146" height="60">
            </a>
        </header>
        <div class="container">
            <div class="tela-login">
                <div class="initial-text">
                    <p class="sub_title">Insira os dados!</p>
                    <div class="home">
                        <a href="">
                            <img id="iconHome"src="assets/icone/home.svg" width="24" height="24">

                        </a>
                    </div>
                </div>
                <p class="title">Olá, pronto para começar?</p>
                <form id="formulario-login">
                    <div class="form-group">
                        <div>
                            <input class="text-input" type="text" placeholder="Coloque a sua Razão Social" id="razao-social" name="razao-social" required>
                            <span id="erro-razao-social" class="span-erro"></span>
                        </div>
                        <div>
                            <input class="text-input" type="text" placeholder="Coloque o seu CNPJ" required name="cnpj" id="cnpj">
                            <span id="erro-cnpj" class="span-erro"></span>
                        </div>
                        <div>
                            <select class="text-input" name="tipo-fornecedor" id="tipo-fornecedor" required>
                                <option class="text-input" value="CAMPO_VAZIO" disabled selected hidden id="tipo-fornecedor-estado-vazio">Selecione o tipo do fornecedor:</option>
                                <option value="FABRICANTE">Fabricante</option>
                                <option value="DISTRIBUIDOR">Distribuidor</option>
                                <option value="REVENDEDOR">Revendedor</option>
                                <option value="INTEGRADOR">Integrador</option>
                            </select>
                            <span id="erro-tipo-fornecedor"></span>
                        </div>
                        <div class="checkbox-group">
                            <input class="checkbox" type="checkbox">
                            <p class="checkboxT">Concordo com os termos de privacidade</p>
                        </div>
                     </div>
                     <div class="button-text-group">
                         <button class="sub_title" type="submit">Finalizar</button>
                         <div class="sPPL">
                             <span class="color">Clicou errado?</span> 
                             <a href="telaLogin.html" class="link-cadastro">Voltar</a> 
                         </div> 
                     </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
