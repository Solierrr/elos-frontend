<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de login</title>
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/text.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/TelaLogin/login.css">

</head>
<body>
    <header>
        <img src="asset/icone/Frame 188.svg" alt="logo-elos" width="146", height="60">
    </header>
    <div class="container">
            <div class="tela-login">
                <p class="subTitle">Insira os dados!</p>
                <p class="">Olá, você por ai denovo?</p>
                <form action="/enviar" method="POST">
                    <input type="email" placeholder="Coloque o seu e-mail aqui">
                    <input type="password" placeholder="Coloque sua senha" class="">
                    <p class="EsqueceuSenha">Esqueceu a senha?</p>
                    <button type="submit">Logar</button>
                    <p class="">Nao tem conta? Fazer cadastro</p>
                </form>
            </div>
            </div>
</body>
</html>
